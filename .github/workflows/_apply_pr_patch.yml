name: Apply prepared PR patch

on:
  push:
    branches:
      - automation/test-patch-runner

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove patch runner
        run: |
          git rm .github/workflows/_apply_pr_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary patch runner"
          git push
